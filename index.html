<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考試時程表 - 品牌工具組</title>
  
  <!-- 引入 Google Fonts: 質感襯線體與乾淨無襯線體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- 引入 Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Phosphor Icons (圖示庫) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --bg-cream: #f4efe9;
      --card-bg: #e6dfd5;
      --accent-brown: #8e735b;
      --accent-dark: #4a3b32;
      --accent-gold: #c5a059;
      --border-brown: rgba(142, 115, 91, 0.25);
    }
    
    body { 
      font-family: 'Noto Sans TC', sans-serif; 
      background-color: var(--bg-cream);
      color: var(--accent-dark);
    }

    h1, h2, h3, .serif-font {
      font-family: 'Noto Serif TC', serif;
    }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(142,115,91,0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(142,115,91,0.5); }
    
    .brand-bg {
      background-color: #f4efe9;
      background-image: 
        radial-gradient(circle, rgba(142,115,91,0.04) 1px, transparent 1px),
        radial-gradient(circle, rgba(142,115,91,0.04) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .brand-card {
      background: #faf7f2;
      border: 1px solid var(--border-brown);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(74, 59, 50, 0.04);
      transition: all 0.3s ease;
    }
    
    .brand-card:hover {
      box-shadow: 0 15px 35px rgba(74, 59, 50, 0.08);
      border-color: rgba(142, 115, 91, 0.5);
    }

    .brand-card-active {
      background: #8e735b;
      color: #faf7f2;
      border: 1px solid #8e735b;
      box-shadow: 0 15px 35px rgba(142, 115, 91, 0.2);
    }

    .brand-input {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border-brown);
      color: var(--accent-dark);
      font-family: 'Noto Sans TC', sans-serif;
      border-radius: 8px;
    }
    .brand-input:focus {
      outline: none;
      border-color: var(--accent-brown);
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(142, 115, 91, 0.15);
    }
  </style>
</head>
<body class="antialiased overflow-hidden selection:bg-[#d8c5b2] selection:text-[#4a3b32] brand-bg h-screen flex flex-col relative">

  <!-- 頂部設定按鈕 -->
  <button onclick="openSettings()" class="absolute top-6 right-6 p-3 text-[#8e735b] hover:text-[#4a3b32] transition-colors duration-300 z-20 flex items-center justify-center rounded-full bg-[#e6dfd5]/60 hover:bg-[#e6dfd5] shadow-sm backdrop-blur-sm" title="系統管理">
    <i class="ph ph-gear-six text-2xl"></i>
  </button>

  <!-- 主容器 -->
  <div class="flex-1 w-full flex flex-col min-h-0 overflow-hidden">
    
    <!-- 上方：品牌標誌與大時鐘區塊 -->
    <div class="w-full flex flex-col justify-center items-center pt-8 pb-4 shrink-0 z-10">
      
      <!-- 精緻的品牌拱形徽標 (呼應圖片中的精緻風格) -->
      <div class="flex flex-col items-center mb-4">
        <div class="border border-[#8e735b]/40 rounded-t-full px-5 pt-4 pb-2 flex flex-col items-center bg-[#faf7f2]/50 backdrop-blur-sm shadow-sm">
          <div class="text-[10px] tracking-[0.3em] text-[#8e735b] mb-1 font-medium">考程專用</div>
          <div class="serif-font text-2xl tracking-[0.2em] font-bold text-[#4a3b32] flex items-center gap-1">
            AB <span class="text-xs text-[#c5a059] font-normal">✦</span>
          </div>
          <div class="text-[9px] tracking-[0.2em] text-[#8e735b]/80 mt-0.5">精緻時程規劃</div>
        </div>
      </div>

      <div id="clock-display" class="serif-font font-bold tracking-[0.05em] tabular-nums text-center text-[#4a3b32]" style="font-size: clamp(5rem, 18vh, 18rem); line-height: 1;">
        --:--:--
      </div>
      <div id="notes-display" class="text-xl md:text-2xl mt-3 tracking-widest text-[#8e735b] px-6 text-center max-w-4xl font-medium">
      </div>
    </div>

    <!-- 下方/中央：考試科目清單區塊 -->
    <div class="w-full max-w-[1500px] mx-auto px-6 pb-12 pt-2 flex-1 flex flex-col justify-center items-center min-h-0">
      <div id="schedule-container" class="flex flex-row flex-wrap justify-center items-center content-center gap-5 w-full h-full overflow-hidden">
        <!-- 內容由 JavaScript 動態生成 -->
      </div>
    </div>
  </div>

  <!-- 右下方：倒數計時器 (浮動) -->
  <div id="countdown-container" class="fixed bottom-8 right-8 z-30 hidden transition-all duration-500 brand-card p-5 bg-[#faf7f2]/95 backdrop-blur-md shadow-[0_10px_30px_rgba(74,59,50,0.12)] transform translate-y-0">
    <div class="text-[#8e735b] text-xs font-bold tracking-[0.2em] mb-1 flex items-center gap-2">
      <i class="ph-fill ph-timer animate-pulse text-[#c5a059]"></i> 本節剩餘時間
    </div>
    <div id="countdown-display" class="text-5xl md:text-6xl serif-font text-[#4a3b32] tabular-nums text-center font-bold tracking-wider leading-none">
      --:--
    </div>
  </div>

  <!-- 設定對話視窗 (Modal) -->
  <div id="settings-modal" class="fixed inset-0 bg-[#4a3b32]/40 backdrop-blur-sm justify-center items-center z-50 p-4 hidden transition-opacity duration-300">
    <div class="w-full max-w-4xl flex flex-col overflow-hidden max-h-[90vh] shadow-2xl rounded-2xl border border-[#8e735b]/30 bg-[#faf7f2] relative">
        
        <div class="p-5 flex justify-between items-center shrink-0 border-b border-[#8e735b]/20 bg-[#e6dfd5]/50">
          <h3 class="text-xl serif-font font-bold flex items-center gap-2 tracking-widest text-[#4a3b32]">
            <i class="ph ph-sliders text-2xl text-[#8e735b]"></i> 系統管理與考程設定
          </h3>
          <button onclick="closeSettings()" class="p-2 text-[#4a3b32]/60 hover:text-[#4a3b32] transition-colors">
            <i class="ph ph-x text-xl"></i>
          </button>
        </div>

        <div class="p-6 overflow-y-auto flex-1 flex flex-col md:flex-row gap-6 min-h-0">
          
          <!-- 左欄：全局設定 -->
          <div class="w-full md:w-5/12 flex flex-col gap-6">
            <div class="brand-card p-5 flex-1">
              <h4 class="text-base font-bold text-[#8e735b] tracking-[0.15s] mb-4 flex items-center gap-2 border-b border-[#8e735b]/20 pb-2 serif-font">
                <i class="ph ph-eye"></i> 畫面顯示設定
              </h4>
              
              <div class="space-y-4">
                <label class="flex items-center gap-3 cursor-pointer group">
                  <input type="checkbox" id="setting-countdown" onchange="autoSaveGlobalSettings()" class="w-4 h-4 rounded border-[#8e735b] text-[#8e735b] focus:ring-[#8e735b] cursor-pointer">
                  <span class="text-base text-[#4a3b32] tracking-wider group-hover:text-[#8e735b] transition-colors">啟用右下方倒數計時</span>
                </label>

                <div class="pt-2">
                  <label class="block text-base font-bold text-[#4a3b32] mb-2 tracking-wider flex items-center gap-2">
                    <i class="ph ph-chat-text text-[#8e735b]"></i> 老師的小叮嚀
                  </label>
                  <textarea id="setting-notes" rows="3" onchange="autoSaveGlobalSettings()" placeholder="例如：請保持安靜，仔細檢查試卷！" class="w-full p-3 brand-input text-base resize-none"></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- 右欄：考程編輯 -->
          <div class="w-full md:w-7/12 flex flex-col">
            <h4 class="text-base font-bold text-[#4a3b32] tracking-[0.15em] mb-3 flex items-center gap-2 border-l-4 border-[#8e735b] pl-3 serif-font">
              考程項目管理
            </h4>
            
            <div class="p-4 brand-card mb-4 grid grid-cols-2 md:flex md:flex-wrap gap-3 items-end bg-[#e6dfd5]/30">
              <div class="col-span-2 md:flex-1 md:min-w-[100px]">
                <label class="block text-xs font-bold text-[#8e735b] mb-1 tracking-wider">科目名稱</label>
                <input type="text" id="new-subject" placeholder="例：國文" class="w-full p-2 brand-input text-base" />
              </div>
              <div class="col-span-1 md:w-32">
                <label class="block text-xs font-bold text-[#8e735b] mb-1 tracking-wider">開始</label>
                <input type="time" id="new-start" class="w-full p-2 brand-input text-base" />
              </div>
              <div class="col-span-1 md:w-32">
                <label class="block text-xs font-bold text-[#8e735b] mb-1 tracking-wider">結束</label>
                <input type="time" id="new-end" class="w-full p-2 brand-input text-base" />
              </div>
              <button id="btn-submit-item" type="button" onclick="addEditingItem()" class="col-span-2 bg-[#8e735b] text-[#faf7f2] hover:bg-[#4a3b32] p-2 flex items-center gap-1 font-bold transition-all w-full md:w-auto justify-center tracking-widest rounded-lg shadow-sm text-sm">
                <i id="submit-icon" class="ph ph-plus text-base"></i> <span id="submit-text">新增</span>
              </button>
            </div>

            <div id="editing-list" class="space-y-2 overflow-y-auto max-h-[30vh] pr-1">
            </div>
          </div>
        </div>

        <div class="p-4 flex justify-end gap-3 shrink-0 border-t border-[#8e735b]/20 bg-[#e6dfd5]/50">
          <button onclick="closeSettings()" class="px-5 py-2 font-bold bg-[#8e735b] text-[#faf7f2] hover:bg-[#4a3b32] rounded-lg transition-all tracking-wider text-sm shadow-sm">
            儲存並關閉
          </button>
        </div>

    </div>
  </div>

  <script>
    const defaultData = {
      schedule: [
        { id: '1', subject: '國文', startTime: '08:10', endTime: '09:30' },
        { id: '2', subject: '英文', startTime: '09:50', endTime: '11:10' },
        { id: '3', subject: '數學', startTime: '11:30', endTime: '12:50' },
      ],
      settings: { showCountdown: true, teacherNotes: '各位同學，考試加油！細心作答喔！' }
    };
    
    let appData = JSON.parse(JSON.stringify(defaultData));
    
    try {
      const savedData = localStorage.getItem('brandBoardAppData');
      if (savedData) appData = JSON.parse(savedData);
    } catch (e) {
      console.error('無法讀取本地儲存資料', e);
    }
    
    let editingSchedule = [];
    let activeExamId = null;
    let currentEditId = null; 

    const formatTime = (date) => {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    };

    const isCurrentExam = (start, end, timeObj) => {
      const currentMinutes = timeObj.getHours() * 60 + timeObj.getMinutes();
      const [startH, startM] = start.split(':').map(Number);
      const [endH, endM] = end.split(':').map(Number);
      const startTotal = startH * 60 + startM;
      const endTotal = endH * 60 + endM;
      return currentMinutes >= startTotal && currentMinutes <= endTotal;
    };

    function renderSchedule() {
      const container = document.getElementById('schedule-container');
      
      if (appData.schedule.length === 0) {
        container.innerHTML = `
          <div class="text-center text-[#8e735b] mt-10 flex flex-col items-center w-full">
            <i class="ph ph-coffee text-5xl mb-3 opacity-60"></i>
            <p class="tracking-widest text-lg font-medium">目前沒有考程，請點擊右上角進行設定</p>
          </div>
        `;
        return;
      }

      container.innerHTML = appData.schedule.map(exam => {
        const isActive = exam.id === activeExamId;
        return `
          <div class="p-5 transition-all duration-500 relative ${isActive ? 'brand-card-active scale-105 z-10' : 'brand-card opacity-90 hover:opacity-100'} w-fit min-w-[220px] flex-shrink-0 group">
            
            ${isActive ? `<span class="absolute -top-3 -left-3 text-[#faf7f2] bg-[#c5a059] text-xs font-bold px-3 py-1 tracking-[0.2em] rounded-full shadow-md z-30 flex items-center gap-1"><i class="ph-fill ph-sparkle"></i> 進行中</span>` : ''}

            <div class="flex flex-col gap-2 h-full justify-center pt-1">
              
              <!-- 科目名稱與動作按鈕 -->
              <div class="flex items-center justify-between gap-4 mb-1">
                <span class="serif-font text-3xl font-bold tracking-wider leading-none ${isActive ? 'text-[#faf7f2]' : 'text-[#4a3b32]'}">
                  ${exam.subject}
                </span>
                
                <div class="flex gap-1 z-20 opacity-60 group-hover:opacity-100 transition-opacity">
                  <button onclick="editFromMain('${exam.id}')" class="${isActive ? 'text-[#faf7f2]/80 hover:text-white' : 'text-[#8e735b] hover:text-[#4a3b32]'} transition-colors p-1" title="修改">
                    <i class="ph ph-pencil-simple text-lg"></i>
                  </button>
                  <button onclick="deleteFromMain('${exam.id}')" class="${isActive ? 'text-[#faf7f2]/80 hover:text-red-200' : 'text-[#8e735b] hover:text-red-700'} transition-colors p-1" title="刪除">
                    <i class="ph ph-trash text-lg"></i>
                  </button>
                </div>
              </div>
              
              <!-- 時間區塊 -->
              <div class="flex items-center gap-3 mt-2 pt-2 border-t ${isActive ? 'border-white/20' : 'border-[#8e735b]/20'}">
                <i class="ph ${isActive ? 'ph-hourglass-high text-[#c5a059]' : 'ph-clock text-[#8e735b]'} text-2xl"></i>
                <div class="flex flex-col gap-0.5">
                  <span class="tracking-wider font-mono text-base font-semibold leading-tight ${isActive ? 'text-[#faf7f2]' : 'text-[#4a3b32]'}">${exam.startTime} - ${exam.endTime}</span>
                </div>
              </div>
              
            </div>
          </div>
        `;
      }).join('');
    }

    function renderEditingSchedule() {
      const listContainer = document.getElementById('editing-list');
      
      if (editingSchedule.length === 0) {
        listContainer.innerHTML = `<p class="text-center text-[#8e735b] py-4 tracking-widest text-sm">尚無考程項目</p>`;
        return;
      }

      listContainer.innerHTML = editingSchedule.map(item => `
        <div class="flex justify-between items-center p-3 brand-card bg-white/60">
          <div class="flex items-center gap-3 flex-wrap flex-1">
            <span class="text-base font-bold text-[#4a3b32] tracking-wider serif-font">${item.subject}</span>
            <span class="text-[#8e735b] px-2.5 py-0.5 font-mono text-sm tracking-wider border-l border-[#8e735b]/30">
              ${item.startTime} - ${item.endTime}
            </span>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="editEditingItem('${item.id}')" class="text-[#8e735b] hover:text-[#4a3b32] p-1.5 transition-colors">
              <i class="ph ph-pencil-simple text-lg"></i>
            </button>
            <button onclick="removeEditingItem('${item.id}')" class="text-[#8e735b] hover:text-red-700 p-1.5 transition-colors">
              <i class="ph ph-trash text-lg"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function renderNotes() {
      const notes = appData.settings.teacherNotes;
      const display = document.getElementById('notes-display');
      display.textContent = notes;
      display.style.display = notes ? 'block' : 'none';
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock-display').textContent = formatTime(now);

      let newActiveExam = null;
      for (const exam of appData.schedule) {
        if (isCurrentExam(exam.startTime, exam.endTime, now)) {
          newActiveExam = exam;
          break;
        }
      }

      if ((newActiveExam ? newActiveExam.id : null) !== activeExamId) {
        activeExamId = newActiveExam ? newActiveExam.id : null;
        renderSchedule();
      }

      const countdownContainer = document.getElementById('countdown-container');
      if (appData.settings.showCountdown && newActiveExam) {
        countdownContainer.classList.remove('translate-y-[150%]', 'opacity-0', 'hidden');
        countdownContainer.classList.add('translate-y-0', 'opacity-100');
        
        const [endH, endM] = newActiveExam.endTime.split(':').map(Number);
        const endDate = new Date();
        endDate.setHours(endH, endM, 0, 0);
        
        let diffSeconds = Math.floor((endDate - now) / 1000);
        if (diffSeconds < 0) diffSeconds = 0; 
        
        const m = String(Math.floor(diffSeconds / 60)).padStart(2, '0');
        const s = String(diffSeconds % 60).padStart(2, '0');
        document.getElementById('countdown-display').textContent = `${m}:${s}`;
      } else {
        countdownContainer.classList.remove('translate-y-0', 'opacity-100');
        countdownContainer.classList.add('translate-y-[150%]', 'opacity-0');
        setTimeout(() => {
          if (!appData.settings.showCountdown || !newActiveExam) countdownContainer.classList.add('hidden');
        }, 500); 
      }
    }

    function autoSaveGlobalSettings() {
      appData.settings.showCountdown = document.getElementById('setting-countdown').checked;
      appData.settings.teacherNotes = document.getElementById('setting-notes').value.trim();
      syncToMainBoard();
    }

    function syncToMainBoard() {
      try { localStorage.setItem('brandBoardAppData', JSON.stringify(appData)); } catch (e) {}
      renderNotes();
      renderSchedule();
      updateClock();
    }

    function openSettings() {
      editingSchedule = JSON.parse(JSON.stringify(appData.schedule)); 
      document.getElementById('setting-countdown').checked = appData.settings.showCountdown;
      document.getElementById('setting-notes').value = appData.settings.teacherNotes;
      
      const modal = document.getElementById('settings-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      renderEditingSchedule();
    }

    function closeSettings() {
      const modal = document.getElementById('settings-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      resetInputFields();
    }

    function editFromMain(id) {
      openSettings();
      editEditingItem(id);
    }

    function deleteFromMain(id) {
      if (confirm('確定要刪除這個考程科目嗎？')) {
        appData.schedule = appData.schedule.filter(item => item.id !== id);
        activeExamId = null; 
        syncToMainBoard();
      }
    }

    function resetInputFields() {
      document.getElementById('new-subject').value = '';
      document.getElementById('new-start').value = '';
      document.getElementById('new-end').value = '';
      
      currentEditId = null;
      const btn = document.getElementById('btn-submit-item');
      document.getElementById('submit-text').textContent = '新增';
      document.getElementById('submit-icon').className = 'ph ph-plus text-base';
      btn.className = "col-span-2 bg-[#8e735b] text-[#faf7f2] hover:bg-[#4a3b32] p-2 flex items-center gap-1 font-bold transition-all w-full md:w-auto justify-center tracking-widest rounded-lg shadow-sm text-sm";
    }

    function addEditingItem() {
      const subjectInput = document.getElementById('new-subject');
      const startInput = document.getElementById('new-start');
      const endInput = document.getElementById('new-end');

      const subject = subjectInput.value.trim();
      const startTime = startInput.value;
      const endTime = endInput.value;

      if (subject && startTime && endTime) {
        if(startTime >= endTime) {
          alert('結束時間必須晚於開始時間喔！');
          return;
        }

        if (currentEditId) {
          const index = editingSchedule.findIndex(item => item.id === currentEditId);
          if (index !== -1) {
            editingSchedule[index] = { ...editingSchedule[index], subject, startTime, endTime };
          }
        } else {
          editingSchedule.push({
            id: Date.now().toString(),
            subject,
            startTime,
            endTime
          });
        }

        editingSchedule.sort((a, b) => a.startTime.localeCompare(b.startTime));
        
        appData.schedule = [...editingSchedule];
        syncToMainBoard();
        
        renderEditingSchedule();
        resetInputFields(); 

        const btn = document.getElementById('btn-submit-item');
        document.getElementById('submit-text').textContent = '成功儲存！';
        btn.classList.add('bg-[#c5a059]', 'text-[#4a3b32]');
        setTimeout(() => {
          document.getElementById('submit-text').textContent = '新增';
          btn.classList.remove('bg-[#c5a059]', 'text-[#4a3b32]');
        }, 1200);

      } else {
        alert('請完整填寫科目名稱與起訖時間！');
      }
    }

    function editEditingItem(id) {
      const item = editingSchedule.find(i => i.id === id);
      if (item) {
        document.getElementById('new-subject').value = item.subject;
        document.getElementById('new-start').value = item.startTime;
        document.getElementById('new-end').value = item.endTime;
        currentEditId = id;
        
        const btn = document.getElementById('btn-submit-item');
        document.getElementById('submit-text').textContent = '更新';
        document.getElementById('submit-icon').className = 'ph ph-check text-base';
        btn.className = "col-span-2 bg-[#c5a059] text-[#4a3b32] hover:bg-[#b08b47] p-2 flex items-center gap-1 font-bold transition-all w-full md:w-auto justify-center tracking-widest rounded-lg shadow-sm text-sm";
      }
    }

    function removeEditingItem(id) {
      editingSchedule = editingSchedule.filter(item => item.id !== id);
      if (currentEditId === id) resetInputFields();
      
      appData.schedule = [...editingSchedule];
      syncToMainBoard();
      
      renderEditingSchedule();
    }

    function init() {
      renderNotes();
      renderSchedule(); 
      updateClock();    
      setInterval(updateClock, 1000);
    }

    window.addEventListener('DOMContentLoaded', init);

  </script>
</body>
</html>
